# This is a Databricks asset bundle definition for upstox_sdp_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: upstox_sdp_project
  uuid: 0d6db209-c56b-4ad0-b976-a37e8a282215

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a4641852-5725.cloud.databricks.com
    variables:
      catalog: stock_catalog
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-a4641852-5725.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/chirus.workspace@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chirus.workspace@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: stock_catalog
      schema: prod
    permissions:
      - user_name: chirus.workspace@gmail.com
        level: CAN_MANAGE
