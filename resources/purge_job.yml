resources:
  jobs:
    purge_job:
      name: stock_retention_purge_job
      tasks:
        - task_key: purge
          spark_python_task:
            python_file: ../src/purge_job.py
            parameters:
              - "${var.catalog}"
              - "${var.schema}"
              - "7"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"