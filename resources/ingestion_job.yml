resources:
  jobs:
    ingestion_job:
      name: upstox_ingestion_job
      tasks:
        - task_key: run_ingestion
          spark_python_task:
            python_file: ../src/run_ingestion.py
            parameters:
              - "${var.catalog}"
              - "${var.schema}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests